<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Okavango - Family Admin, Simplified</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: #fdfdfb;
      color: #1a1a1a;
    }
    header {
      padding: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .logo {
      display: flex;
      align-items: center;
      font-weight: 700;
      font-size: 1.5rem;
      color: #174F32;
    }
    .logo-icon {
      width: 32px;
      height: 32px;
      background: url('https://via.placeholder.com/32x32?text=🌿') no-repeat center/contain;
      margin-right: 0.5rem;
    }
    main {
      padding: 4rem 2rem;
      text-align: center;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: #174F32;
    }
    p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    .cta-button {
      background-color: #174F32;
      color: white;
      padding: 1rem 2rem;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
    }
    .cta-button:hover {
      background-color: #14633F;
    }
    footer {
      padding: 2rem;
      text-align: center;
      font-size: 0.9rem;
      color: #777;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-icon"></div>
      OKAVANGO
    </div>
  </header>

  <main>
    <h1>Family Admin, Simplified</h1>
    <p>Okavango helps you streamline the invisible work of running a family. From scheduling to school forms, we take care of the chaos so you can enjoy the calm.</p>
    <button class="cta-button">Join the Waitlist</button>
  </main>

  <footer>
    &copy; 2025 Okavango. All rights reserved.
  </footer>
</body>
</html>
